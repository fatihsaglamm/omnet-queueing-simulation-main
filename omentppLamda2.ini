[General]
network = Task1MM1LInet
sim-time-limit = 100000s

*.lambda = 2
*.mu = 5
*.L = 5

**.vector-recording = false
**.scalar-recording = true
**.queue.queueLength.result-recording-modes = +timeavg,+max
**.queue.queueingTime.result-recording-modes = +mean,+histogram
**.queue.droppedPacketsQueueOverflow.result-recording-modes = +count

**.server.incomingPackets.result-recording-modes = +count
**.server.outgoingPackets.result-recording-modes = +count


**.sink.incomingPackets.result-recording-modes = +count

cmdenv-express-mode = true