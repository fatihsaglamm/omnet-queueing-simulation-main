[General]
network = MMcL_Inet
sim-time-limit = 1000000s
warmup-period = 10000s

*.lambda = 2
*.mu = 5
*.c = 2
*.L = 5

**.vector-recording = false

**.scalar-recording = true

**.queue.queueLength.result-recording-modes = +timeavg,+max
**.queue.queueingTime.result-recording-modes = +mean,+histogram
**.queue.droppedPacketsQueueOverflow.result-recording-modes = +count
**.queue.incomingPackets.result-recording-modes = +count
**.queue.outgoingPackets.result-recording-modes = +count


**.server[*].incomingPackets.result-recording-modes = +count
**.server[*].outgoingPackets.result-recording-modes = +count

**.sink.incomingPackets.result-recording-modes = +count

**.sink.packets.result-recording-modes = +count

cmdenv-express-mode = true



[Config c2_lambda2]
*.c = 2
*.lambda = 2


[Config c2_lambda3]
*.c = 2
*.lambda = 3


[Config c2_lambda4]
*.c = 2
*.lambda = 4


[Config c4_lambda2]
*.c = 4
*.lambda = 2


[Config c4_lambda3]
*.c = 4
*.lambda = 3


[Config c4_lambda4]
*.c = 4
*.lambda = 4